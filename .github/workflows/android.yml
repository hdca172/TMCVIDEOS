name: Compilar TMCVIDEOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto
        run: unzip TMCVIDEOS_Android_Project.zip -d extracted

      - name: Compilar APK
        working-directory: extracted/TMCVIDEOS
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TMCVIDEOS-APK
          path: extracted/TMCVIDEOS/app/build/outputs/apk/debug/app-debug.apk
