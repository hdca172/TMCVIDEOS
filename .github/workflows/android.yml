
name: Compilar TMCVIDEOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto
        run: unzip TMCVIDEOS_Android_Project.zip -d extracted

      - name: Corregir compatibilidad Java y Kotlin
        working-directory: extracted/TMCVIDEOS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          patch = """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          """
          if "sourceCompatibility JavaVersion.VERSION_17" not in s:
              s = s.replace("android {", patch, 1)
          p.write_text(s)
          PY

      - name: Compilar APK
        working-directory: extracted/TMCVIDEOS
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TMCVIDEOS-APK
          path: extracted/TMCVIDEOS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
